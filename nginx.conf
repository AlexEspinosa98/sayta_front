# Configuración Nginx para el contenedor del frontend Sayta
# Sirve la SPA estática y hace proxy al backend para /api/ y /health/

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos de la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html referencia los assets por nombre con hash (index-XXXX.js);
    # si el navegador lo cachea, sigue apuntando a un JS viejo después de
    # cada deploy y los fixes no llegan hasta un hard refresh manual. Debe
    # revalidar siempre.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Caché para assets estáticos (nombre con hash de contenido: si el
    # contenido cambia, cambia el nombre, así que este caché largo es seguro)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
